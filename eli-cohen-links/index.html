<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eli Cohen Hair</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #1d1b19;
    --muted: #6b655e;
    --accent: #b08d57;
    --border: #e6e0d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1f1d1b;
      --text: #f2eee8;
      --muted: #a39b91;
      --accent: #d4b07a;
      --border: #2f2c29;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 14px; }
  a.btn {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 17px; font-weight: 600;
    transition: transform .15s, border-color .15s;
  }
  a.btn:hover, a.btn:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn svg { width: 24px; height: 24px; flex: none; }
  a.btn span { flex: 1; text-align: center; margin-left: 24px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="logo">EC</div>
  <h1>אלי כהן</h1>
  <p class="sub">Eli Cohen Hair Center</p>

  <nav>
    <a class="btn primary" href="https://search.google.com/local/writereview?placeid=ChIJH0fihTxLHRUR3GTMWXUcOoo" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.5 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
      <span>השאירו ביקורת בגוגל</span>
    </a>
    <a class="btn" href="https://www.hair-center.co.il/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <span>האתר שלנו</span>
    </a>
    <a class="btn" href="https://www.instagram.com/eli_cohen_hair?cnvx=NDYwOG1zYmN5Zm9u" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      <span>Instagram</span>
    </a>
    <a class="btn" href="https://www.facebook.com/@elicohenhair" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.7-4.5 4.5V11H7v4h2.5v7h4v-7H17l.5-4h-4V8.8c0-.5.3-.8.5-.8z"/></svg>
      <span>Facebook</span>
    </a>
    <a class="btn" href="https://www.tiktok.com/@eli_cohen_hair" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 1.9 3.8 4 4v3.4c-1.5 0-2.9-.5-4-1.2V15a6 6 0 1 1-6-6h.5v3.5a2.5 2.5 0 1 0 2 2.5V3z"/></svg>
      <span>TikTok</span>
    </a>
  </nav>

  <footer>© Eli Cohen Hair</footer>
</main>
</body>
</html>
